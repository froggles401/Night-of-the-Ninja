app = "night-of-the-ninja"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  # Tables live in memory: a stopped machine ends every game in progress.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
